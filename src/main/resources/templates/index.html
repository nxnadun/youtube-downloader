<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<main class="container">
    <header class="header">
        <aside class="notice" role="note">
        <h1>YouTube Video Downloader</h1>
        <p class="subtitle">Local tool powered by Nadun Yalegama</p>
        </aside>
    </header>

    <section class="panel">
        <label for="urlInput">YouTube URL</label>
        <input id="urlInput" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" maxlength="2048">
        <div class="actions">
            <button id="infoBtn" type="button" class="btn primary">Get Video Information</button>
        </div>
    </section>

    <section id="infoSection" class="panel hidden">
        <h2>Video information</h2>
        <div class="info-grid">
            <img id="thumbnail" class="thumbnail" alt="Video thumbnail" hidden>
            <div class="info-meta">
                <p><strong>Title:</strong> <span id="title">—</span></p>
                <p><strong>Channel:</strong> <span id="uploader">—</span></p>
                <p><strong>Duration:</strong> <span id="duration">—</span></p>
            </div>
        </div>

        <div id="formatsBlock" class="formats hidden">
            <h3>Available formats (simplified)</h3>
            <ul id="formatsList"></ul>
        </div>

        <fieldset class="quality">
            <legend>Quality</legend>
            <label><input type="radio" name="quality" value="BEST" checked> Best</label>
            <label><input type="radio" name="quality" value="1080P"> 1080p</label>
            <label><input type="radio" name="quality" value="720P"> 720p</label>
            <label><input type="radio" name="quality" value="480P"> 480p</label>
            <label><input type="radio" name="quality" value="360P"> 360p</label>
            <label><input type="radio" name="quality" value="AUDIO"> Audio only</label>
        </fieldset>

        <div class="actions">
            <button id="downloadBtn" type="button" class="btn primary">Download</button>
        </div>
    </section>

    <section class="panel status-panel">
        <h2>Status</h2>
        <p id="statusText" class="status">Ready</p>
        <div id="progressWrap" class="progress-wrap hidden" aria-live="polite">
            <svg class="progress-ring" viewBox="0 0 36 36" aria-hidden="true">
                <path class="progress-ring-bg"
                      d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                <path id="progressArc" class="progress-ring-fg"
                      stroke-dasharray="0, 100"
                      d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            </svg>
            <div class="progress-meta">
                <span id="progressPercent" class="progress-percent">0%</span>
                <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>
        </div>
        <a id="fileLink" class="btn secondary hidden" href="#" download>Download File</a>
    </section>
</main>

<script th:src="@{/js/app.js}" src="/js/app.js"></script>
</body>
</html>
